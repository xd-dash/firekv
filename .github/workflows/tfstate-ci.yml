name: Private tfstate Worker
on:
  pull_request:
    paths: ['tfstate/**', '.github/workflows/tfstate-ci.yml']
  push:
    branches: [main]
    paths: ['tfstate/**', '.github/workflows/tfstate-ci.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test tfstate/worker.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx wrangler deploy --config tfstate/wrangler.jsonc --dry-run

name: Qualify FireKV durable Terraform backend (offline)
on:
  push:
    branches: [codex/tfstate-durable-oidc]
    paths:
      - tfstate/durable*
      - tfstate/oidc*
      - tfstate/wrangler.durable.jsonc
      - .github/workflows/tfstate-durable-ci.yml
permissions:
  contents: read
concurrency:
  group: firekv-tfstate-durable-static
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test durable state and OIDC session logic
        run: node --test tfstate/durable.test.mjs tfstate/oidc.test.mjs
      - name: Qualify Worker bundle without deploying
        working-directory: tfstate
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --config wrangler.durable.jsonc --dry-run

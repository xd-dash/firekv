name: final FireKV hardening

on:
  push:
    branches: [codex/final-hardening]
    paths:
      - .github/workflows/final-hardening.yml
      - src/**
      - test/**
      - package.json
      - package-lock.json
      - wrangler.jsonc
      - FIREKV_IDIOMS.md

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate exact lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Qualify exact candidate
        run: |
          npm test
          npm run typecheck
          npm run dry-run
      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name 'dev@dashxd'
          git config user.email '125025267+dash-xd@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Lock hardened auth.net.im composition'
          git push origin HEAD:codex/final-hardening

name: Qualify dashxd design composition

on:
  push:
    branches: [codex/dashxd-public-design]
    paths:
      - .github/workflows/qualify-dashxd-design.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run dry-run
